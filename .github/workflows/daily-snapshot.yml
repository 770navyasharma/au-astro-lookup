name: Daily Snapshot

on:
  schedule:
    # 02:00 IST = 20:30 UTC previous day
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Specific date YYYY-MM-DD (optional, defaults to yesterday IST)"
        required: false
        default: ""
      backfill_from:
        description: "Backfill range start YYYY-MM-DD (optional)"
        required: false
        default: ""
      backfill_to:
        description: "Backfill range end YYYY-MM-DD (optional)"
        required: false
        default: ""

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run snapshot
        env:
          PINOT_URL: ${{ secrets.PINOT_URL }}
          PINOT_USER: ${{ secrets.PINOT_USER }}
          PINOT_PASSWORD: ${{ secrets.PINOT_PASSWORD }}
          YUKTI_BASE_URL: ${{ secrets.YUKTI_BASE_URL }}
          YUKTI_USERNAME: ${{ secrets.YUKTI_USERNAME }}
          YUKTI_PASSWORD: ${{ secrets.YUKTI_PASSWORD }}
        run: |
          if [ -n "${{ inputs.backfill_from }}" ] && [ -n "${{ inputs.backfill_to }}" ]; then
            python scripts/daily_snapshot.py --range "${{ inputs.backfill_from }}" "${{ inputs.backfill_to }}"
          elif [ -n "${{ inputs.date }}" ]; then
            python scripts/daily_snapshot.py --date "${{ inputs.date }}"
          else
            python scripts/daily_snapshot.py
          fi

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No new data to commit."
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC') snapshot"
            git push
          fi
